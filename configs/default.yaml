# ==============================================================================
# DubbingStory — Default Pipeline Configuration
# ==============================================================================

# ── Project ──────────────────────────────────────────────────────────────────
project:
  name: ""                          # Auto-generated from video filename if empty
  output_dir: "outputs"

# ── Ingest ───────────────────────────────────────────────────────────────────
ingest:
  download_height: "1080"            # "720", "1080" (default), "2k", "4k", "max"
  read_subtitles: true              # Auto-read SRT/ASS/VTT if found alongside video
  use_asr_fallback: true            # If no subtitles, transcribe audio with Whisper ASR

# ── ASR (Automatic Speech Recognition) ────────────────────────────────────────
whisper:
  model: "base"                     # tiny | base | small | medium | large | large-v3
  language: null                    # Force language code (e.g., "id", "en") or null for auto
  device: "cpu"                     # "cpu" | "cuda"
  compute_type: "int8"              # "float32", "float16", "int8_float16", "int8"


# ── Scene Detection ──────────────────────────────────────────────────────────
segment:
  detector: "adaptive"              # "adaptive" | "content" | "threshold"
  adaptive_threshold: 3.0
  min_scene_duration: 2.0           # Minimum scene length in seconds
  max_scene_duration: 15.0          # Split very long continuous shots into analysis/selectable windows
  merge_short_scenes: true          # Merge scenes shorter than min_scene_duration

# ── Keyframe Extraction ──────────────────────────────────────────────────────
keyframes:
  strategy: "distributed"           # "distributed" (start,25%,50%,75%,end) | "interval"
  interval_seconds: 2.0             # For "interval" strategy
  max_per_scene: 7                  # Upper bound; notebook speed preset can override to 3
  max_edge: 768                     # Deep vision keeps more fine detail/OCR than the old 640px path
  jpeg_quality: 88                  # Source-frame JPEG quality

# ── Vision (Scene Understanding) ────────────────────────────────────────────
# Provider "gemini" uses Google Gemini API (needs GOOGLE_API_KEY)
# Provider "openai" uses any OpenAI-compatible endpoint (Qwen3-VL via vLLM, etc.)
vision:
  provider: "gemini"                # "gemini" | "openai"
  # --- Gemini settings ---
  gemini_model: "gemini-2.5-flash"
  gemini_fallback_model: "gemini-2.0-flash"
  # --- OpenAI-compatible settings (for Qwen3-VL, HuggingFace, etc.) ---
  # Browse models: https://huggingface.co/models?pipeline_tag=image-text-to-text&sort=trending
  openai_model: "Qwen/Qwen3-VL-2B-Instruct"
  openai_base_url: "http://127.0.0.1:8000/v1"
  openai_max_tokens: 640
  # Qwen3-VL official VL sampling baseline. Avoid temperature=0 greedy decoding:
  # greedy can keep choosing a legal "continue" token inside structured output.
  openai_temperature: 0.7
  openai_top_p: 0.8
  openai_top_k: 20
  openai_presence_penalty: 1.5
  openai_repetition_penalty: 1.0
  openai_structured_outputs: true   # vLLM decode-time JSON Schema guardrail
  openai_allow_schema_fallback: false # Do not silently weaken schema on local vLLM
  # Qwen3-VL image budget uses dimensions/32 grid when dimensions are available.
  # This value is only the fallback for unknown/unreadable images/non-Qwen models.
  openai_image_token_cost: 512
  # Error-specific recovery budgets. Normal scene calls stay capped at 640.
  openai_truncation_retry_tokens: 896
  openai_runaway_rescue_tokens: 448
  openai_temporal_truncation_retry_tokens: 6144
  openai_runaway_threshold: 0.35
  concurrency: 2                    # Match local vLLM replicas where practical
  # --- Shared settings ---
  analysis_mode: "keyframes"        # "keyframes" | "video_upload" (gemini only)
  domain_hint: ""                   # e.g., "workshop", "cooking", "repair"
  batch_size: 4                     # Number of keyframes sent per API call

# ── Global Story Understanding (V2) ─────────────────────────────────────────
story:
  enabled: true                     # Build scene_cards/story_plan/story_memory after vision
  model: "gemini-2.5-flash"         # Text reasoning only; vision remains on configured provider
  prompt_max_chars: 60000           # Conservative global-plan prompt budget

# ── Summary / Story-aware Selection ──────────────────────────────────────────
summary:
  target_duration: null             # null = auto (~60-120s); CLI can override
  max_scenes: null                  # null = auto
  min_scene_score: 0.30
  analysis_candidates: 32           # Deep-analyze enough candidates before final selection
  duration_tolerance: 1.05          # Never intentionally exceed target by old 20% allowance

# ── Narration ────────────────────────────────────────────────────────────────
narration:
  style: "viral_fb"                 # "viral_fb" | "documentary" | "technical" | "calm_educational"
  languages: ["id", "en"]           # Languages to generate
  max_words_per_scene: 50           # Legacy ceiling; V2 uses duration-aware budgets
  hedging_threshold: 0.5            # Below this confidence, use hedging language
  model: "gemini-2.5-flash"
  target_wpm: 160                   # Initial Indonesian/English storytelling target
  min_wpm: 135
  max_wpm: 175
  speech_coverage: 0.84             # Aim for useful narration across most of the recap
  group_scenes: true                # Multiple adjacent shots can become one narration thought
  target_beat_duration: 11.0        # Prefer human-sized narration thoughts across visual cuts
  max_beat_duration: 18.0
  plan_llm_refine: true             # Let Gemini refine intent/continuity, not timing budgets
  auto_rewrite: true                # One QA rewrite when narration is sparse/repetitive/hype-heavy

# ── TTS ──────────────────────────────────────────────────────────────────────
tts:
  engine: "edge"                    # "edge" | "piper" | "chirp" (Google Cloud Chirp 3 HD)
  use_timeline_scheduler: true       # V2: do not pad every short sentence to full scene length
  max_speedup: 1.12                 # Gentle safety fit; rewrite text instead of extreme speed
  min_gap: 0.20                     # Minimum separation between adjacent narration beats
  normalize_loudness: true          # Normalize final voice track around -16 LUFS
  # Edge-TTS voices (Microsoft Neural TTS, free, no API key needed)
  edge_voices:
    id: "id-ID-ArdiNeural"          # Indonesian male narrator
    en: "en-US-GuyNeural"           # US English male narrator
  # Piper voices (offline fallback)
  voices:
    id: "id_ID-news_tts-medium"
    en: "en_US-lessac-medium"
  # Google Cloud Chirp 3 HD (requires Application Default Credentials / ADC)
  chirp_voices:
    id: "id-ID-Chirp3-HD-Charon"
    en: "en-US-Chirp3-HD-Charon"
  speaking_rate: 1.0                # Speed multiplier

# ── Render ───────────────────────────────────────────────────────────────────
render:
  ratios: ["16:9"]                  # Output ratios: "16:9", "9:16", or both
  audio_strategy: "dynamic_duck"    # "dynamic_duck" | "duck" | "replace" | "mute_original"
  original_volume: 0.15             # Volume level for original audio when ducking
  burn_subtitles: false             # Burn subtitles into video
  video_quality_crf: 20
