# ==============================================================================
# DubbingStory — Narration Style Definitions
# ==============================================================================

styles:
  viral_fb:
    name: "Engaging Social Storytelling"
    tone: "engaging, conversational, informative, curious"
    language_style:
      id: "Bahasa Indonesia natural dan casual; jelaskan proses seperti storyteller yang memahami video"
      en: "Natural conversational English; explain the story rather than reacting to every shot"
    rules:
      - "Buka dengan masalah, tujuan, atau perubahan nyata dalam video — bukan clickbait generik"
      - "Utamakan penjelasan sebab → proses/perubahan → akibat → langkah berikutnya"
      - "Hubungkan setiap beat dengan informasi yang sudah diketahui; jangan mengulang fakta yang sama"
      - "Gunakan reaksi emosional hanya sesekali dan hanya jika memang menambah makna"
      - "Hindari pola berulang seperti 'Lihat ini!', 'Luar biasa!', 'Amazing!', atau 'kalian pasti gak nyangka'"
      - "Gunakan tanda seru secara jarang; suara harus terasa hidup, bukan hyperactive announcer"
      - "Jangan mengarang nama komponen, motivasi, hubungan, atau penyebab yang tidak didukung bukti"
    examples:
      id:
        - "Masalahnya bukan sekadar membongkar motor ini. Komponen penggantinya harus dibentuk ulang agar ukurannya benar-benar pas."
        - "Setelah diameter luarnya sesuai, bagian tengah masih perlu dibor. Sedikit saja meleset, komponen ini bisa gagal saat dipasang."
        - "Baru setelah proses pembentukan dan penyambungan selesai, hasilnya bisa diuji kembali di motor."
      en:
        - "The challenge is not just taking the machine apart. The replacement part has to be shaped precisely enough to fit."
        - "Once the outer diameter is right, the center still needs drilling, because a small error here can ruin the final fit."
        - "Only after the machining and joining work is finished can the result be tested again."

  jozzr_social:
    name: "Jozzr-style Process Storytelling"
    tone: "concise, grounded, confident, conversational, process-first"
    language_style:
      id: "Bahasa Indonesia natural, padat, dan mudah diikuti; terdengar seperti narator yang memahami proses, bukan komentator yang bereaksi pada gambar"
      en: "Natural concise English; sound like a narrator who understands the process rather than reacting to the footage"
    rules:
      - "Buka langsung dengan masalah, tujuan, risiko, atau perubahan konkret yang membuat proses ini perlu dilakukan; tanpa salam atau clickbait generik"
      - "Setiap beat harus menambah informasi baru: alasan langkah, perubahan kondisi, konsekuensi, atau langkah berikutnya; jangan hanya menyebut ulang apa yang sudah jelas terlihat"
      - "Gunakan alur masalah/tujuan → tindakan penting → perubahan → alasan/konsekuensi → langkah berikutnya → payoff"
      - "Utamakan kalimat pendek-menengah dengan satu gagasan utama; gabungkan beberapa shot yang masih menjelaskan satu proses menjadi satu pikiran naratif"
      - "Gunakan penghubung sebab-akibat secara natural seperti 'karena', 'agar', 'setelah itu', 'baru kemudian', atau 'hasilnya'; jangan memaksa transisi di setiap kalimat"
      - "Jaga nada tenang dan yakin. Hindari gaya announcer, reaksi berlebihan, ajakan penonton, dan filler seperti 'lihat ini', 'wow', 'luar biasa', atau 'kalian pasti gak nyangka'"
      - "Jika detail teknis tidak didukung evidence, jelaskan fungsi/perubahannya secara generik daripada menebak nama komponen atau penyebab"
      - "Buat penutup sebagai payoff dari masalah/tujuan awal: hasil akhir, pengujian, pemasangan, atau kondisi baru yang benar-benar didukung evidence"
      - "Pilih tanda baca yang enak dibacakan TTS: titik untuk jeda utama, koma untuk klausa pendek; hindari kalimat sangat panjang dan tanda seru beruntun"
    examples:
      id:
        - "Bagian ini belum bisa langsung dipasang. Ukurannya lebih dulu disesuaikan agar posisinya benar-benar pas dengan dudukannya."
        - "Setelah bentuk luarnya mendekati ukuran yang dibutuhkan, bagian tengah masih harus dikerjakan. Tahap ini menentukan apakah komponen bisa terpasang tanpa memaksa sambungan."
        - "Baru setelah penyambungan selesai, permukaannya dirapikan dan hasilnya diperiksa lagi sebelum komponen digunakan."
      en:
        - "This part cannot be installed yet. Its dimensions have to be corrected first so it can sit properly in place."
        - "Once the outer shape is close to the required size, the center still needs work. This step determines whether the part can fit without forcing the joint."
        - "Only after the joining work is complete is the surface cleaned up and the result checked again before use."
    tts:
      # Used as a gentle multiplier on top of tts.speaking_rate. Keep near 1.0;
      # script cadence should do most of the work instead of aggressive speed-up.
      speaking_rate_multiplier: 1.02

  documentary:
    name: "Documentary"
    tone: "formal, informative, neutral, authoritative"
    language_style:
      id: "Bahasa Indonesia formal, deskriptif, kalimat pasif"
      en: "Formal English, descriptive, third-person narration"
    rules:
      - "Gunakan kalimat pasif dan deskriptif"
      - "Netral, tidak emosional berlebihan"
      - "Fokus pada fakta dan proses"
      - "Struktur: konteks → proses → hasil"
    examples:
      id:
        - "Pada bagian ini, mekanik mulai memeriksa kerusakan pada komponen coupling fan hub..."
        - "Proses perbaikan dimulai dengan pembersihan permukaan yang terkorosi..."
      en:
        - "In this segment, the mechanic begins examining the damage to the fan hub coupling..."
        - "The repair process starts with cleaning the corroded surface..."

  technical:
    name: "Technical Expert"
    tone: "precise, expert, analytical"
    language_style:
      id: "Bahasa Indonesia teknis, istilah spesifik"
      en: "Technical English, specific terminology"
    rules:
      - "Gunakan istilah teknis yang tepat"
      - "Spesifik soal proses dan material"
      - "Analitis, bukan emosional"
    examples:
      id:
        - "Kerusakan terjadi pada area hub coupling, kemungkinan akibat beban puntir berlebih..."
        - "Teknisi menggunakan mesin bubut untuk mempresisi dimensi bearing seat..."
      en:
        - "The failure occurred at the hub coupling interface, likely due to excessive torsional load..."
        - "The technician uses a lathe to precision-machine the bearing seat dimensions..."

  calm_educational:
    name: "Calm Educational"
    tone: "gentle, patient, step-by-step"
    language_style:
      id: "Bahasa Indonesia lembut, sabar, bertahap"
      en: "Calm English, patient explanation, educational tone"
    rules:
      - "Nada tenang dan sabar"
      - "Jelaskan step-by-step"
      - "Cocok untuk tutorial dan pembelajaran"
    examples:
      id:
        - "Proses dimulai dengan mengamati bagian yang patah secara seksama..."
        - "Perhatikan bagaimana mekanik dengan hati-hati membersihkan setiap bagian..."
      en:
        - "The process begins with a careful observation of the fractured area..."
        - "Notice how the mechanic carefully cleans each component..."