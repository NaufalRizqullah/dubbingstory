[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dubbingstory"
version = "1.0.0"
description = "Automated video narration & dubbing — turn silent/foreign videos into dubbed stories with AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]",
    "opencv-python",
    "scenedetect[opencv]",
    "google-genai",
    "piper-tts",
    "edge-tts>=7.3.1,<8",
    "pysubs2",
    "Pillow",
    "pyyaml",
    "python-dotenv",
    "requests",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "jinja2",
    "sentence-transformers>=3.0,<6",
]

[project.optional-dependencies]
alignment = [
    "whisperx>=3.8.6,<4",
]
test = [
    "pytest>=8,<10",
    "jsonschema>=4.21",
]
advanced = [
    "torch",
    "torchaudio",
]
openai-vision = [
    "openai>=1.0.0",
]
colab = [
    "openai>=1.0.0",
    "vllm",
]

[project.scripts]
dubbingstory = "dubbingstory.cli:main"
